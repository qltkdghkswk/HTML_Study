<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <title>9강 background color 연습 페이지</title>
    </head>
    <body style="background-color:black">

        
        <h1 style="background-color:brown; color:white;">style에 대해 배우는 중 현재 background-color, text-color 배움</h1>
        <p style="background-color: blueviolet; color:white;">배경색을 black으로 지정하고 글자색을 흰색으로 바꾸었습니다.</p>
        <!-- 두개 이상의 property를 지정할 때는 ; 를 사용한다. property : background-color같은 것들-->
    </body>
</html>
