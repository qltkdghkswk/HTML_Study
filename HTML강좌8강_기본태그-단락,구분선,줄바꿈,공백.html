<!-- <p> : 단락 또는 문단을 의미한다. 영문으로 paragraphs로 표기 -->
<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>8 걍 연습 페이지.</title>
    </head>
    <body>
        <pre> <!-- 원본 코드 그대로 웹페이지에 불러옴(아직 잘 모르겠음) -->
            <p>여기는 첫번째 &nbsp;&nbsp;&nbsp;&nbsp;잉         단락을 표시하고 있습니다.</p> <!-- &nbsp; 가 공백 표시 -->
            <hr> <!-- 가로선 -->
            <p>여기는 두번째 단락을 표시하고 있습니다.</p> <!-- <p>태그 안에 공백을 작성해도 웹사이트에서 표현되지 않음 -->
            <br>
            <br>
            <br>
            <p>br 덕분에 줄바꿈 됌</p>
        </pre>
    </body>
</html>
